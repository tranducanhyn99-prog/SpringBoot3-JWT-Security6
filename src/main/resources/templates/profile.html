<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot REST API with AJAX</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5" style="min-height: 500px; max-width: 800px;">
        <!-- User Profile Card -->
        <div class="card p-4 shadow-sm border-0 mb-4" style="border-radius: 12px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h4 text-primary fw-bold mb-0">Spring Boot REST API with AJAX Example</h3>
                <button id="logout" type="button" class="btn btn-outline-danger btn-sm px-3">Đăng xuất (Logout)</button>
            </div>
            <hr>
            <div class="text-center my-3">
                <img id="images" src="/images/default-avatar.png" alt="Avatar" width="110" height="110" class="rounded-circle border mb-3 object-fit-cover shadow-sm">
                <h4 id="profile" class="text-dark fw-bold mb-1">Đang tải thông tin...</h4>
                <p id="userEmail" class="text-muted mb-2"></p>
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">Xác thực JWT thành công (Bearer Token)</span>
            </div>
        </div>

        <!-- All Users Table Card -->
        <div class="card p-4 shadow-sm border-0" style="border-radius: 12px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="h5 fw-bold text-dark mb-0">Danh sách người dùng hệ thống (/users)</h4>
                <button id="btnReloadUsers" type="button" class="btn btn-sm btn-outline-primary">Làm mới danh sách</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Ngày tạo</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-3">Đang tải danh sách người dùng...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>

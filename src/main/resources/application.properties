spring.application.name=SpringBoot3-JWT-Security6
server.port=8005

# Chọn profile mặc định: 'h2' (chạy ngay không cần cài đặt) hoặc 'sqlserver' (kết nối SQL Server)
spring.profiles.active=h2

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình Secret Key và Expiration Time cho JWT (theo đúng slide bài giảng)
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Thời hạn token: 1 giờ (3600000 ms)
security.jwt.expiration-time=3600000
